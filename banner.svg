<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bloomIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 60) scale(560 420)">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 600) scale(620 380)">
      <stop offset="0" stop-color="#00A36A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00A36A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomAmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 40) scale(380 260)">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#00B08E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="640" fill="#090a12"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#bloomIndigo)"/>
  <rect width="1280" height="640" fill="url(#bloomGreen)"/>
  <rect width="1280" height="640" fill="url(#bloomAmber)"/>

  <!-- Left: copy -->
  <g transform="translate(80 0)">
    <rect x="0" y="150" width="232" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="18" cy="166" r="4" fill="#00B08E"/>
    <text x="32" y="171" font-size="14" fill="#CBD5E1" letter-spacing="0.3">cloudcake/filament-themes</text>

    <text x="0" y="262" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-2">Filament</text>
    <text x="0" y="340" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-2">Themes</text>
    <rect x="2" y="362" width="120" height="4" rx="2" fill="url(#spectrum)"/>

    <text x="0" y="408" font-size="20" fill="#94A3B8">Presets, auth layouts, blooms, borders,</text>
    <text x="0" y="436" font-size="20" fill="#94A3B8">roundness and shadows for Filament panels.</text>

    <!-- Code pill -->
    <rect x="0" y="472" width="452" height="48" rx="12" fill="#0F1120" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="502" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace">
      <tspan fill="#A5B4FC">Theme</tspan><tspan fill="#64748B">::</tspan><tspan fill="#E2E8F0">make</tspan><tspan fill="#64748B">()-&gt;</tspan><tspan fill="#E2E8F0">preset</tspan><tspan fill="#64748B">(</tspan><tspan fill="#A5B4FC">Preset</tspan><tspan fill="#64748B">::</tspan><tspan fill="#34D399">Pristine</tspan><tspan fill="#64748B">)</tspan>
    </text>
  </g>

  <!-- Right: stacked panel mockups -->

  <!-- Back: Default (amber, square-ish) -->
  <g transform="translate(700 92) rotate(-6)" filter="url(#shadow)" opacity="0.75">
    <rect width="420" height="270" rx="6" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect width="96" height="270" rx="6" fill="#111113"/>
    <rect x="16" y="18" width="52" height="10" rx="3" fill="#F59E0B"/>
    <rect x="16" y="48" width="64" height="8" rx="3" fill="#3F3F46"/>
    <rect x="16" y="68" width="56" height="8" rx="3" fill="#3F3F46"/>
    <rect x="16" y="88" width="60" height="8" rx="3" fill="#3F3F46"/>
    <rect x="116" y="22" width="150" height="14" rx="3" fill="#E4E4E7" fill-opacity="0.85"/>
    <rect x="116" y="56" width="140" height="80" rx="6" fill="#27272A"/>
    <rect x="266" y="56" width="138" height="80" rx="6" fill="#27272A"/>
    <rect x="116" y="150" width="288" height="100" rx="6" fill="#27272A"/>
    <text x="406" y="258" font-size="11" fill="#71717A" text-anchor="end">Preset::Default</text>
  </g>

  <!-- Middle: AddPay (green, slight roundness, solid 1px) -->
  <g transform="translate(760 200) rotate(-2)" filter="url(#shadow)">
    <rect width="420" height="270" rx="10" fill="#050706" stroke="#00A36A" stroke-opacity="0.45"/>
    <circle cx="40" cy="30" r="90" fill="#00A36A" fill-opacity="0.12"/>
    <rect x="0.5" y="0.5" width="96" height="269" rx="10" fill="#0A1010" fill-opacity="0.9"/>
    <rect x="16" y="18" width="52" height="10" rx="4" fill="#00B08E"/>
    <rect x="16" y="48" width="64" height="18" rx="5" fill="#00A36A" fill-opacity="0.18"/>
    <rect x="24" y="53" width="40" height="8" rx="3" fill="#34D399"/>
    <rect x="16" y="76" width="56" height="8" rx="3" fill="#1F2A28"/>
    <rect x="16" y="96" width="60" height="8" rx="3" fill="#1F2A28"/>
    <rect x="116" y="20" width="18" height="18" rx="5" fill="#00A36A" fill-opacity="0.25"/>
    <rect x="121" y="25" width="8" height="8" rx="2" fill="#34D399"/>
    <rect x="142" y="22" width="130" height="14" rx="4" fill="#F1F5F4"/>
    <rect x="116" y="56" width="140" height="80" rx="8" fill="#0A1010" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="130" y="72" width="50" height="7" rx="3" fill="#3A4744"/>
    <rect x="130" y="90" width="80" height="16" rx="4" fill="#E2E8F0" fill-opacity="0.9"/>
    <rect x="266" y="56" width="138" height="80" rx="8" fill="#0A1010" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M280 116 L304 104 L326 110 L350 88 L372 94 L392 74" fill="none" stroke="#00B08E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="150" width="288" height="100" rx="8" fill="#0A1010" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="130" y="166" width="120" height="8" rx="3" fill="#3A4744"/>
    <rect x="130" y="186" width="260" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="130" y="198" width="180" height="8" rx="3" fill="#1F2A28"/>
    <rect x="130" y="218" width="150" height="8" rx="3" fill="#1F2A28"/>
    <rect x="340" y="212" width="50" height="20" rx="6" fill="#00A36A"/>
    <text x="406" y="262" font-size="11" fill="#34D399" fill-opacity="0.7" text-anchor="end">Preset::AddPay</text>
  </g>

  <!-- Front: Pristine (indigo, pill roundness, soft shadows) -->
  <g transform="translate(640 330) rotate(3)" filter="url(#shadow)">
    <rect width="380" height="230" rx="22" fill="#0D0F1C" stroke="#6366F1" stroke-opacity="0.5"/>
    <circle cx="340" cy="20" r="110" fill="#4F46E5" fill-opacity="0.16"/>
    <rect x="20" y="20" width="22" height="22" rx="11" fill="#4F46E5" fill-opacity="0.3"/>
    <circle cx="31" cy="31" r="5" fill="#A5B4FC"/>
    <rect x="52" y="24" width="120" height="14" rx="7" fill="#EEF2FF"/>
    <rect x="270" y="20" width="90" height="24" rx="12" fill="#4F46E5"/>
    <rect x="290" y="29" width="50" height="6" rx="3" fill="#EEF2FF"/>
    <rect x="20" y="62" width="165" height="70" rx="18" fill="#141733" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="36" y="78" width="44" height="7" rx="3.5" fill="#3B3F6B"/>
    <rect x="36" y="96" width="90" height="18" rx="9" fill="#E0E7FF" fill-opacity="0.9"/>
    <rect x="195" y="62" width="165" height="70" rx="18" fill="#141733" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="211" y="110" width="14" height="10" rx="5" fill="#6366F1" fill-opacity="0.5"/>
    <rect x="231" y="98" width="14" height="22" rx="7" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="251" y="86" width="14" height="34" rx="7" fill="#818CF8"/>
    <rect x="271" y="94" width="14" height="26" rx="7" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="291" y="78" width="14" height="42" rx="7" fill="#A5B4FC"/>
    <rect x="311" y="90" width="14" height="30" rx="7" fill="#6366F1" fill-opacity="0.7"/>
    <rect x="331" y="80" width="14" height="40" rx="7" fill="#818CF8"/>
    <rect x="20" y="144" width="340" height="66" rx="18" fill="#141733" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="48" cy="177" r="12" fill="#4F46E5" fill-opacity="0.35"/>
    <rect x="70" y="166" width="130" height="8" rx="4" fill="#C7D2FE" fill-opacity="0.8"/>
    <rect x="70" y="182" width="90" height="7" rx="3.5" fill="#3B3F6B"/>
    <rect x="290" y="166" width="54" height="22" rx="11" fill="#4F46E5" fill-opacity="0.25" stroke="#818CF8" stroke-opacity="0.5"/>
    <text x="360" y="224" font-size="11" fill="#A5B4FC" fill-opacity="0.75" text-anchor="end">Preset::Pristine</text>
  </g>
</svg>
